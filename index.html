<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f7f8;color:#1a1a1a;line-height:1.6;-webkit-text-size-adjust:100%}.container{max-width:720px;margin:0 auto;padding:0 0 40px}.header{background:linear-gradient(135deg,#0b3d2e,#1a8a5a);color:#fff;padding:32px 20px 28px;text-align:center;position:sticky;top:0;z-index:10}.header h1{font-size:22px;margin-bottom:4px}.header p{opacity:.85;font-size:13px}.card{background:#fff;border-radius:14px;padding:24px 18px;margin:16px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}.card h2{font-size:17px;color:#0b3d2e;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid #eef1f5;display:flex;align-items:center;gap:8px}.card h2 .num{background:#0b3d2e;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}.fg{margin-bottom:16px}.fg label.q{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:#333}.hint{font-size:12px;color:#888;font-weight:400}.fg select,.fg input[type=text]{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;background:#fafafa;-webkit-appearance:none}.fg select:focus,.fg input:focus{outline:none;border-color:#1a8a5a;background:#fff}.radio-row{display:flex;gap:10px;flex-wrap:wrap}.radio-row .ropt{flex:1;min-width:80px;padding:10px 14px;border:1.5px solid #ddd;border-radius:8px;text-align:center;cursor:pointer;font-size:14px;background:#fafafa;transition:all .15s;user-select:none}.radio-row .ropt.sel{border-color:#1a8a5a;background:#e8faf2;font-weight:600;color:#0b3d2e}.radio-row input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.btn{display:block;width:calc(100% - 24px);margin:20px auto;padding:14px;background:linear-gradient(135deg,#0b3d2e,#1a8a5a);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}.results-wrap{display:none;margin:0 12px}.results-wrap.show{display:block}.rs-card{background:#fff;border-radius:14px;padding:20px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}.rs-card h3{font-size:18px;margin-bottom:8px;color:#0b3d2e}.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:3px}.tg{background:#dcfce7;color:#166534}.ty{background:#fef3c7;color:#92400e}.tr{background:#fee2e2;color:#991b1b}.prog{background:#f8fafc;border-radius:10px;padding:15px;margin-bottom:10px}.prog.el{border-left:4px solid #22c55e}.prog.mb{border-left:4px solid #f59e0b}.prog.no{border-left:4px solid #e0e0e0;opacity:.88}.prog h4{font-size:15px;margin-bottom:6px;color:#0b3d2e}.st{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:6px}.st-q{background:#dcfce7;color:#166534}.st-m{background:#fef3c7;color:#92400e}.st-n{background:#fee2e2;color:#991b1b}.d{font-size:13px;color:#555;line-height:1.7}.g{color:#166534;font-weight:600}.o{color:#c2410c;font-weight:600}table.cm{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}table.cm th,table.cm td{border:1px solid #e2e8f0;padding:7px;text-align:center}table.cm th{background:#f1f5f9;font-weight:600;font-size:11px}.hb{background:#e8faf2;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin:10px 0;font-size:13px}.hb.w{background:#fff7ed;border-color:#fed7aa}.btn-sm{display:inline-block;padding:10px 20px;margin:4px 0;background:#eef1f5;color:#555;border:none;border-radius:8px;font-size:13px;cursor:pointer}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#1a8a5a;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
.flow-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.flow-actions button{flex:1;min-width:110px;border:0;border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}.flow-primary{background:linear-gradient(135deg,#0b3d2e,#1a8a5a);color:#fff}.flow-secondary{background:#eef1f5;color:#555}.choice-grid{display:grid;gap:10px}.choice-card{border:2px solid #e5e7eb;border-radius:12px;padding:13px;background:#fafafa;cursor:pointer}.choice-card.sel{border-color:#1a8a5a;background:#e8faf2}.choice-card h4{font-size:15px;color:#0b3d2e;margin-bottom:4px}.choice-card p{font-size:12px;color:#666}.project-list{display:none;margin-top:12px}.project-list.show{display:block}.project-opt{border:1.5px solid #e5e7eb;border-radius:10px;padding:11px;margin-bottom:8px;background:#fff;cursor:pointer}.project-opt.sel{border-color:#22c55e;background:#f0fdf4}.stage-hint{font-size:12px;color:#888;margin-top:6px}.choice-grid{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.choice-card{border:2px solid #ddd;border-radius:10px;padding:14px 12px;cursor:pointer;flex:1;min-width:90px;text-align:center;transition:all .15s;user-select:none}
.choice-card h4{font-size:14px;margin-bottom:4px;color:#0b3d2e}
.choice-card p{font-size:12px;color:#888;margin:0}
.choice-card.sel{border-color:#1a8a5a;background:#e8faf2;font-weight:600}
.project-list{display:none;margin:8px 0;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.project-list.show{display:block}
.project-opt{padding:12px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:14px;transition:all .15s;user-select:none}
.project-opt:last-child{border-bottom:none}
.project-opt:hover{background:#e8faf2}
.project-opt.sel{background:#e8faf2;font-weight:600;color:#0b3d2e;border-left:3px solid #1a8a5a}
.flow-actions{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.flow-primary{background:linear-gradient(135deg,#0b3d2e,#1a8a5a);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.flow-primary:active{transform:scale(.97)}
.flow-secondary{background:#eef1f5;color:#555;border:none;border-radius:10px;padding:12px 28px;font-size:14px;cursor:pointer}
@media(max-width:400px){.radio-row .ropt{min-width:60px;padding:8px 10px;font-size:13px}.card{padding:18px 14px;margin:10px 8px}.header h1{font-size:19px}}
.project-check-grid{display:flex;flex-direction:column;gap:8px;margin:10px 0}.project-check{display:flex;align-items:flex-start;gap:8px;padding:12px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fafafa;cursor:pointer;font-size:13px;line-height:1.5;transition:all .15s}.project-check:has(input:checked){border-color:#22c55e;background:#f0fdf4}.project-check input[type=checkbox]{margin-top:2px;accent-color:#22c55e;width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🇳🇿 新西兰移民项目资格评估</h1><p>基于INZ 2025-2026政策 · 约4分钟</p></div>
<form id="qform">
<div class="card"><h2><span class="num">1</span> 基本信息</h2>
<div class="fg"><label class="q">年龄</label><select id="age"><option value="">请选择</option><option value="18-30">18-30岁</option><option value="31-40">31-40岁</option><option value="41-50">41-50岁</option><option value="51-55">51-55岁</option><option value="56+">56岁及以上</option></select></div>
<div class="fg"><label class="q">国籍/身份</label><select id="nationality"><option value="">请选择</option><option value="cn">中国内地</option><option value="hkmo">中国香港/澳门</option><option value="tw">中国台湾</option><option value="other">其他国家/地区</option></select></div>
<div class="fg"><label class="q">是否有无犯罪记录<span class="hint">（选择"是"表示无犯罪记录；17岁以上通常需提供警察证明）</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="nocrim" value="yes"> 是</label><label class="ropt"><input type="radio" name="nocrim" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否有健康证明<span class="hint">（需体检/胸透，视签证和年龄而定）</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="health" value="yes"> 是</label><label class="ropt"><input type="radio" name="health" value="no"> 否</label></div></div>
</div>
<div class="card"><h2><span class="num">2</span> 投资能力（Active Investor Plus）</h2>
<div class="fg"><label class="q">可投资净资产（纽币 NZD）</label><select id="invest_budget"><option value="">请选择</option><option value="lt5m">低于 NZD 500万</option><option value="5m-10m">NZD 500万-1000万</option><option value="gte10m">NZD 1000万及以上</option></select></div>
<div class="fg"><label class="q">可接受的投资类型</label><select id="invest_type"><option value="">请选择</option><option value="growth">偏增长型：直接投资/管理基金/高风险投资</option><option value="balanced">偏均衡型：债券/房地产型/混合投资</option><option value="both">两类都可接受</option><option value="none">暂不考虑投资移民</option></select></div>
<div class="fg"><label class="q">投资资金来源是否可合法解释？</label><div class="radio-row"><label class="ropt"><input type="radio" name="fundsource" value="yes"> 是</label><label class="ropt"><input type="radio" name="fundsource" value="partial"> 部分</label><label class="ropt"><input type="radio" name="fundsource" value="no"> 否</label></div></div>
</div>
<div class="card"><h2><span class="num">3</span> 技术/雇主路径</h2>
<div class="fg"><label class="q">最高学历</label><select id="education"><option value="">请选择</option><option value="doctor">博士</option><option value="master">硕士</option><option value="bachelor">本科/荣誉学位</option><option value="diploma">大专/职业资格</option><option value="highschool">高中及以下</option></select></div>
<div class="fg"><label class="q">英语能力</label><select id="english"><option value="">请选择</option><option value="ielts65">雅思6.5或同等</option><option value="functional">基础/功能性英语</option><option value="weak">较弱</option></select></div>
<div class="fg"><label class="q">是否已有新西兰认证雇主工作offer？</label><div class="radio-row"><label class="ropt"><input type="radio" name="nz_offer" value="yes"> 是</label><label class="ropt"><input type="radio" name="nz_offer" value="neg"> 洽谈中</label><label class="ropt"><input type="radio" name="nz_offer" value="no"> 否</label></div></div>
<div class="fg"><label class="q">职位类型/清单</label><select id="job_type"><option value="">请选择</option><option value="green1">Green List Tier 1</option><option value="green2">Green List Tier 2</option><option value="anzsco13">ANZSCO 1-3技能岗位</option><option value="anzsco45">ANZSCO 4-5岗位</option><option value="unknown">不确定</option><option value="none">暂无职位</option></select></div>
<div class="fg"><label class="q">绿名单/职业所属行业<span class="hint">（不确定可选"不确定"，后续需核职业代码）</span></label><select id="green_sector"><option value="">请选择</option><option value="health">医疗健康</option><option value="engineering">工程/建筑/基础设施</option><option value="ict">ICT/数字技术</option><option value="education">教育</option><option value="trades">技工/建筑技能</option><option value="primary">农业/初级产业</option><option value="other">其他</option><option value="unknown">不确定</option></select></div>
<div class="fg"><label class="q">时薪水平（纽币 NZD）<span class="hint">（中位数约$35/小时；双倍约$70；三倍约$105）</span></label><select id="wage"><option value="">请选择</option><option value="none">暂无新西兰工资</option><option value="lt35">低于 $35/小时</option><option value="35-52">$35-$52.49/小时（中位数以上）</option><option value="gte52">$52.50-$69.99/小时（1.5倍以上）</option><option value="gte70">$70-$104.99/小时（双倍高薪）</option><option value="gte105">$105/小时及以上（三倍高薪）</option></select></div>
<div class="fg"><label class="q">是否已在新西兰技能岗位工作满24个月？</label><div class="radio-row"><label class="ropt"><input type="radio" name="nz_work_24" value="yes"> 是</label><label class="ropt"><input type="radio" name="nz_work_24" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否有新西兰职业注册？</label><select id="registration"><option value="">请选择</option><option value="6">6分注册（需6年训练/经验）</option><option value="5">5分注册</option><option value="4">4分注册</option><option value="3">3分注册</option><option value="none">无/不适用</option></select></div>
<div class="fg"><label class="q">新西兰技能工作经验</label><select id="nz_exp"><option value="">请选择</option><option value="0">0年</option><option value="1">1年</option><option value="2">2年</option><option value="3+">3年及以上</option></select></div>
</div>
<div class="card"><h2><span class="num">4</span> 派遣 / ICT / 跨国公司路径</h2>
<div class="fg"><label class="q">是否有海外母公司/集团向新西兰分支、子公司或客户项目派遣的可能？</label><div class="radio-row"><label class="ropt"><input type="radio" name="ict_possible" value="yes"> 是</label><label class="ropt"><input type="radio" name="ict_possible" value="neg"> 洽谈中</label><label class="ropt"><input type="radio" name="ict_possible" value="no"> 否</label></div></div>
<div class="fg"><label class="q">派遣角色</label><select id="ict_role"><option value="">请选择</option><option value="exec">高管/管理层</option><option value="specialist">关键技术/专才</option><option value="project">短期项目/安装调试/交付</option><option value="none">不适用</option></select></div>
<div class="fg"><label class="q">新西兰接收方是否可成为认证雇主或已有认证雇主资质？</label><div class="radio-row"><label class="ropt"><input type="radio" name="ict_accredited" value="yes"> 是</label><label class="ropt"><input type="radio" name="ict_accredited" value="unknown"> 不确定</label><label class="ropt"><input type="radio" name="ict_accredited" value="no"> 否</label></div></div>
</div>
<div class="card"><h2><span class="num">5</span> 家庭/配偶路径</h2>
<div class="fg"><label class="q">是否有新西兰公民/居民配偶或稳定伴侣？</label><div class="radio-row"><label class="ropt"><input type="radio" name="partner_nz" value="yes"> 是</label><label class="ropt"><input type="radio" name="partner_nz" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否需要配偶/子女随行？</label><div class="radio-row"><label class="ropt"><input type="radio" name="family" value="yes"> 是</label><label class="ropt"><input type="radio" name="family" value="no"> 否</label></div></div>
</div>
<div class="card"><h2><span class="num">6</span> 目标与预算</h2>
<div class="fg"><label class="q">主要目标<span class="hint">（可多选）</span></label><div class="radio-row"><label class="ropt"><input type="checkbox" name="purpose" value="invest"> 投资居留</label><label class="ropt"><input type="checkbox" name="purpose" value="work"> 工作/雇主</label><label class="ropt"><input type="checkbox" name="purpose" value="pr"> PR/永久回头签</label><label class="ropt"><input type="checkbox" name="purpose" value="edu"> 子女教育</label><label class="ropt"><input type="checkbox" name="purpose" value="welfare"> 福利/养老</label></div></div>
<div class="fg"><label class="q">时间紧迫程度</label><select id="urgency"><option value="">请选择</option><option value="urgent">希望6个月内明确路径</option><option value="normal">6-12个月可接受</option><option value="flexible">1年以上也可以</option></select></div>
</div>
<button type="button" class="btn" onclick="submitForm()">📊 提交评估</button>
</form>
<div class="results-wrap" id="results"></div>
</div>
<script>
(function(){var D=document;function R(n){var e=D.querySelector('input[name="'+n+'"]:checked');return e?e.value:null}function S(id){var e=D.getElementById(id);return e?e.value:''}function CB(n){var a=[];D.querySelectorAll('input[name="'+n+'"]:checked').forEach(function(e){a.push(e.value)});return a}function Y(v){return v==='yes'?'是':v==='no'?'否':v||'未填'}
function selectOption(label){var input=label.querySelector('input');if(!input)return;if(input.type==='radio'){input.checked=true;var row=label.closest('.radio-row');if(row)row.querySelectorAll('.ropt').forEach(function(l){l.classList.remove('sel')});label.classList.add('sel')}else if(input.type==='checkbox'){input.checked=!input.checked;label.classList.toggle('sel',input.checked)}}
D.querySelectorAll('.radio-row .ropt').forEach(function(label){label.setAttribute('tabindex','0');label.addEventListener('touchstart',function(e){selectOption(this);e.preventDefault()},{passive:false});label.addEventListener('mousedown',function(e){selectOption(this);e.preventDefault()});label.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){selectOption(this);e.preventDefault()}})});

// Navigation
window.goBack=function(){D.getElementById('results').classList.remove('show');D.getElementById('qform').style.display='';setTimeout(function(){D.getElementById('qform').scrollIntoView({behavior:'smooth'})},50)};window.goPrevStage=function(){
  var u=new URL(window.location.href);
  var ret=u.searchParams.get('return')||'';
  if(ret){window.location.href=ret;return;}
  window.location.href='https://sewen38.github.io/family-plan/?issue='+(u.searchParams.get('issue')||'');
};
window.onProjectCheck=function(){};window.onProjectCheck=function(){};
window.goExecPlan=function(){
  var checks=document.querySelectorAll('input[name="selProject"]:checked');
  if(checks.length===0){alert('请至少选择一个通过评估的项目');return;}
  var projects=Array.from(checks).map(function(c){return c.value;});
  var u=new URL(window.location.href);
  var batch=u.searchParams.get('batch')||'';
  var issue=u.searchParams.get('issue')||'';
  if(batch==='1'&&issue){
    try{var bd=JSON.parse(localStorage.getItem('***')||'{}');bd[issue]=bd[issue]||{};bd[issue]['nz']={projects:projects,ts:Date.now()};localStorage.setItem('***',JSON.stringify(bd));}catch(e){}
    var retUrl=u.searchParams.get('return')||'https://sewen38.github.io/family-plan/?batch=1&issue='+issue;
    window.location.href=retUrl;return;
  }
  window.location.href='https://sewen38.github.io/nz-assessment/exec.html?issue='+issue+'&projects='+projects.join(',');
};
var execPageUrl='https://sewen38.github.io/nz-assessment/exec.html';

function smcPoints(edu,registration,wage,nzExp){var core=0,coreLabel='';if(registration&&registration!=='none'){core=parseInt(registration,10);coreLabel='职业注册 '+core+'分'}else if(edu==='doctor'){core=6;coreLabel='博士学历 6分'}else if(edu==='master'){core=5;coreLabel='硕士学历 5分'}else if(edu==='bachelor'){core=4;coreLabel='本科/荣誉学位 4分'}else if(wage==='gte105'){core=6;coreLabel='三倍高薪路径 6分'}else if(wage==='gte70'){core=6;coreLabel='双倍高薪路径 6分'}else if(wage==='gte52'){core=4;coreLabel='约1.5倍中位数工资 4分'}else if(wage==='35-52'){core=3;coreLabel='中位数工资以上 3分'}var exp={0:0,1:1,2:2,'3+':3}[nzExp]||0;var total=Math.min(6,core+exp);return {core:core,exp:exp,total:total,label:coreLabel||'核心技能分不足'}}
