<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" style="max-width:720px;font-family:system-ui,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#c8102e"/></marker></defs><rect width="720" height="300" fill="#fefafa" rx="14"/><text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#c8102e">AIP Active Investor Plus(投资移民)</text><rect x="50" y="45" width="150" height="55" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/><text x="125" y="62" text-anchor="middle" font-size="9" font-weight="600">资金准备NZD500万</text><text x="125" y="78" text-anchor="middle" font-size="9" fill="#6b7280">合法来源证明</text><line x1="202" y1="72" x2="238" y2="72" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="45" width="150" height="55" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/><text x="315" y="62" text-anchor="middle" font-size="9" font-weight="600">LIA递交申请</text><text x="315" y="78" text-anchor="middle" font-size="9" fill="#6b7280">≈35工作日AIP</text><line x1="392" y1="72" x2="428" y2="72" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="430" y="45" width="150" height="55" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/><text x="505" y="62" text-anchor="middle" font-size="9" font-weight="600">获原则批准→6月内</text><text x="505" y="78" text-anchor="middle" font-size="9" fill="#6b7280">完成NZD500万投资</text><line x1="582" y1="72" x2="618" y2="72" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="620" y="45" width="80" height="55" rx="10" fill="#fef2f5" stroke="#c8102e" stroke-width="2"/><text x="660" y="72" text-anchor="middle" font-size="9" font-weight="600">居民签证</text><line x1="660" y1="102" x2="660" y2="135" stroke="#c8102e" stroke-width="1.5"/><line x1="660" y1="135" x2="46" y2="135" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="110" width="160" height="50" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/><text x="130" y="130" text-anchor="middle" font-size="10" font-weight="600">维持投资36月</text><text x="130" y="148" text-anchor="middle" font-size="9" fill="#6b7280">Growth类别</text><line x1="212" y1="135" x2="248" y2="135" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="110" width="160" height="50" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/><text x="330" y="130" text-anchor="middle" font-size="10" font-weight="600">RV满2年→PRV</text><text x="330" y="148" text-anchor="middle" font-size="9" fill="#6b7280">永久回头签</text><line x1="412" y1="135" x2="448" y2="135" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="450" y="110" width="200" height="50" rx="10" fill="#fef2f5" stroke="#c8102e" stroke-width="2"/><text x="550" y="130" text-anchor="middle" font-size="11" font-weight="700">PRV全球唯一永久回头</text><text x="550" y="148" text-anchor="middle" font-size="9" fill="#6b7280">无居住/出入境限制</text><line x1="550" y1="162" x2="550" y2="195" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="195" width="180" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="330" y="215" text-anchor="middle" font-size="10" font-weight="600">RV满5年→入籍(可选)</text><text x="330" y="233" text-anchor="middle" font-size="9" fill="#78716c">须放弃中国国籍</text></svg>
