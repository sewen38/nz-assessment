var projectMap={'nz-aip-growth':'新西兰AIP Growth ($500万)','nz-aip-balanced':'新西兰AIP Balanced ($1,000万)','nz-smc-6pt':'新西兰SMC 6分制','nz-green-tier1':'新西兰Green List T1直通','nz-green-tier2':'新西兰Green List T2转居留','nz-aewv-to-pr':'新西兰AEWV→转居留'};
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inlineMd(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')}
function mdToHtml(md){var lines=String(md||'').replace(/\r\n/g,'\n').split('\n'),html='',inList=false,inTable=false,table=[];function closeList(){if(inList){html+='</ul>';inList=false}}function closeTable(){if(!inTable)return;html+='<div class="table-wrap"><table>';for(var i=0;i<table.length;i++){var cells=table[i].split('|').slice(1,-1).map(function(c){return c.trim()});if(i===1&&cells.every(function(c){return /^:?-{3,}:?$/.test(c)}))continue;html+='<tr>'+(i===0?cells.map(function(c){return '<th>'+inlineMd(c)+'</th>'}).join(''):cells.map(function(c){return '<td>'+inlineMd(c)+'</td>'}).join(''))+'</tr>'}html+='</table></div>';inTable=false;table=[]}for(var i=0;i<lines.length;i++){var line=lines[i].trimEnd();if(!line){closeList();closeTable();continue}if(/^```/.test(line)){continue}if(/^\|.*\|$/.test(line)){closeList();inTable=true;table.push(line);continue}closeTable();if(/^#{1,6}\s+/.test(line)){closeList();var lv=line.match(/^#{1,6}/)[0].length;html+='<h'+lv+'>'+inlineMd(line.replace(/^#{1,6}\s+/,''))+'</h'+lv+'>';continue}if(/^[-*]\s+/.test(line)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}closeList();html+='<p>'+inlineMd(line)+'</p>'}closeList();closeTable();return html}

function buildPlan(){
 var issue=q('issue')||'未关联';var solution=q('solution')||'A';var project=q('project')||'nz-aip-growth';var projectName=projectMap[project]||project;
 document.getElementById('meta').textContent='来源：评估结果 Issue #'+issue+' · 已选方案 '+solution;
 document.getElementById('projectPill').textContent=projectName;
 document.getElementById('summary').innerHTML='本执行策划案按客户交付版V2.0模板生成（扩充版），包含14个完整章节：客户信息确认、核心策略（四大路径全景对比+深度分析）、合规清理、身份路径深度规划（全景表+每路径解析）、教育规划、财富架构（含流程图）、税务分析、福利居住国规划、预算明细（每路径独立费用表）、执行时间轴（每路径流程图+完整时间线）、风险声明+法律附件。';
 var md='# 新西兰移民执行策划案\n\n> 生成日期：2026-06-09\n> 适用对象：拟通过新西兰Active Investor Plus（AIP）投资移民或技术移民路径取得居民/永居身份的高净值家庭/企业主\n> 文档版本：客户交付版 V2.0（扩充版）\n> 重要声明：本策划案为商业规划与执行框架，不构成法律、税务、投资或移民建议；落地前须由新西兰持牌移民顾问（Licensed Immigration Adviser）或移民律师进行最终确认。\n\n---\n\n## 摘要结论\n\n**新西兰是当前英语发达国家中唯一保留活跃投资移民项目且PRV（永久回头签证）独一无二的国家。2025年4月1日AIP重大改革后门槛大幅降低。**\n\n本方案提供四大主路径：\n\n- **AIP Growth（$500万NZD）**——2025年改革后门槛从$1,500万降至$500万，取消英语要求，3年锁定\n- **AIP Balanced（$1,000万NZD）**——更稳健投资类型（债券+房地产型），5年锁定\n- **SMC 6分制技术移民**——无投资，基于学历/职业注册/收入+NZ工作经验计分\n- **Green List绿名单**——Tier 1直通居留/Tier 2工作转居留，覆盖紧缺职业\n\n新西兰身份的核心价值：**全球唯一的PRV永久回头签证（获后无居住限制）**、免费公立医疗教育（获批RV即刻享受）、新西兰护照含金量极高（190国免签）、入籍后自由在澳洲生活工作（SCV 444签证）。\n\n## 一、客户家庭基本信息（待补充版）\n\n### 1.1 已知/默认信息\n\n| 项目 | 当前信息 | 状态 |\n|---|---|---|\n| 客户身份 | 中国籍家庭/企业主/高净值客户 | ⚠️ 待确认 |\n| 核心目标 | 取得第二身份/永居、全球流动性、子女教育、安全备选 | ⚠️ 待确认 |\n| 预算范围 | AIP Growth: NZD 500万起；Balanced: NZD 1,000万起 | ✅ 已知政策门槛 |\n| 家庭成员 | 主申请人、配偶、受养子女（24岁以下） | ⚠️ 待确认 |\n| 英语能力 | AIP已取消英语；SMC需雅思6.5 | ⚠️ 待确认 |\n| 投资风险偏好 | Growth: 管理基金/直投（较高风险）；Balanced: 债券+房地产型 | ⚠️ 待确认 |\n| 是否计划在NZ居住 | AIP可降低居住要求；转PRV需满足条件 | ⚠️ 待确认 |\n| 资金来源 | NZD 500-1000万来源须合法可追踪 | ❌ 待确认 |\n| 税务身份 | 中国税务居民默认 | ⚠️ 待确认 |\n| 年龄（SMC路径） | SMC有55岁上限 | ⚠️ 待确认 |\n| 职业（Green List路径） | 是否在绿名单职业 | ⚠️ 待确认 |\n\n### 1.2 待解决问题分级\n\n| 编号 | 问题 | 严重度 | 说明 |\n|---|---|---|---|\n| Q1 | 客户能否满足AIP $500万-1000万投资门槛？ | P1 | 2025改革已大幅降低但仍是大额 |\n| Q2 | 客户投资风险偏好：Growth（较高风险）vs Balanced（低风险） | P1 | 决定AIP子类别 |\n| Q3 | 资金出境路径是否合法 | P0 | $500万-1000万NZD必须合规 |\n| Q4 | SMC年龄（55岁）/ 英语（雅思6.5）是否达标 | P1 | SMC硬性条件 |\n| Q5 | PRV居住/投资条件是否能满足？ | P1 | 通常需2年满足条件 |\n| Q6 | 是否持有新西兰雇主offer？ | P2 | SMC/Green List需要 |\n| Q7 | 客户是否有Green List紧缺职业背景？ | P2 | 医疗/工程/ICT/教育等 |\n| Q8 | 税务居民身份切换 | P2 | 如在NZ年住≥183天触发NZ全球征税 |\n\n### 1.3 根本判断\n\n**表面问题**：客户想移民新西兰。\n\n**真实问题**：新西兰当前是英语发达国家中最具吸引力的投资移民目的地—AIP改革后门槛大幅下降（2025年4月）、取消英语要求、PRV永久回头、居民福利即刻享受、入籍后澳洲自由通行。与澳洲188关停、英国Tier 1关闭形成鲜明对比，新西兰是目前英语国家的"投资移民绿洲"。核心矛盾在于：AIP Growth $500万NZD投资的较高风险性质 vs 客户传统的保值诉求。\n\n---\n\n## 二、核心策略\n\n### 2.1 四大路径全景定位\n\n| 维度 | AIP Growth | AIP Balanced | SMC 6分制 | Green List T1 |\n|---|---|---|---|---|\n| 适合人群 | 高净值投资者（$500万NZD+） | 稳健型高净值投资者（$1,000万NZD+） | 有技能职业+学历+英语 | 紧缺职业（医疗/工程/ICT） |\n| 投资要求 | NZD 500万，3年锁定 | NZD 1,000万，5年锁定 | 无 | 无 |\n| 雇主要求 | 无 | 无 | 认证雇主+技能offer | 认证雇主+Tier 1 offer |\n| 年龄上限 | 无明确上限 | 无明确上限 | 55岁 | 55岁 |\n| 英语要求 | **已取消** | **已取消** | 雅思6.5 | 视职业 |\n| 签证类型 | 居民签证(RV) | 居民签证(RV) | 居民签证(RV) | 居民签证(RV) |\n| 转PRV | 2年 | 2年 | 2年 | 2年 |\n| 入籍 | 5年（1,350天+） | 5年 | 5年 | 5年 |\n| 推荐优先级 | ★★★★★ | ★★★★ | ★★★ | ★★★★ |\n\n### 2.2 AIP 2025年4月1日改革核心变化\n\n| 改革维度 | 旧政策（2022-2025.3） | 新政策（2025.4.1起） | 影响 |\n|---|---|---|---|\n| 最低投资额 | NZD 1,500万 | Growth: NZD 500万 / Balanced: NZD 1,000万 | **大幅降低** |\n| 英语要求 | 雅思5.0 | **已取消** | 重大利好中国家庭 |\n| 投资类型 | 股票/债券/管理基金等 | Growth扩大+新类别 | 更多选择 |\n| 投资期限 | 4年（股票/债券） | Growth 3年 / Balanced 5年 | Growth缩短 |\n| 处理速度 | 平均6-8个月 | AIP平均35工作日 | **大幅提速** |\n| 年度名额 | 约400个/年 | 无正式上限 | 更开放 |\n\n### 2.3 推荐方案A：AIP Growth — 投资移民最优路径\n\n**理由**：\n1. **门槛已降**：2025.4.1改革后从$1,500万→$500万，降幅67%\n2. **已取消英语**：对中国高净值家庭是重大利好\n3. **PRV永久回头**：全球独一无二——获后永久有效，无任何居住和出入境限制\n4. **福利即刻享受**：获批RV后即刻享受免费公立医疗和子女免费K-12教育\n5. **处理速度极快**：AIP平均35工作日，投资完成后RV平均36工作日\n6. **投资期限仅3年**：Growth类别最短\n7. **申请热度验证**：截至2026.5已收730份申请（2,390名申请人），608份为Growth\n\n**投资类型要求**（Growth类别）：\n- 管理基金（Managed Funds）\n- 直接投资新西兰企业\n- 最多20%可配置慈善投资\n\n### 2.4 推荐方案B：AIP Balanced — 稳健型投资\n\n| 与Growth差异 | 详细 |\n|---|---|\n| 最低投资额 | NZD 1,000万（比Growth多$500万） |\n| 投资期限 | 至少60个月（比Growth多2年） |\n| 投资类型 | 债券、房地产型投资、上市股票、管理基金、最多20%慈善 |\n| 适合人群 | 风险偏好较低、资产规模更大、接受更长锁定期 |\n| 优势 | 投资类型更接近传统资产配置逻辑（债券+上市股票） |\n\n### 2.5 推荐方案C：SMC 6分制技术移民 — 零投资路径\n\n**6分制机制详解**：\n\n| 分数来源 | 具体分值 | 举例 |\n|---|---|---|\n| 学历分 | 博士=6分 / 硕士=5分 / 学士=3分 | 博士毕业直接满足6分 |\n| 职业注册分 | ≥6年注册经验=6分 | 新西兰注册医师/工程师等 |\n| 收入分 | 收入≥3倍中位数=6分 | 约NZD$110/小时以上 |\n| NZ工作经验分 | 每年=1分，最高3分 | 硕士5分+1年NZ经验=6分 |\n\n**6分制分数组合示例**：\n\n| 组合 | 学历/注册/收入分 | NZ工作经验分 | 总分数 |\n|---|---|---|---|\n| 博士直通 | 博士6分 | 0 | 6分 ✅ |\n| 硕士+1年NZ经验 | 硕士5分 | 1年=1分 | 6分 ✅ |\n| 学士+3年NZ经验 | 学士3分 | 3年=3分 | 6分 ✅ |\n| 高收入直通 | 3倍中位数6分 | 0 | 6分 ✅ |\n\n**2026年8月新增路径**：\n- 技能工作经验路径：5年相关经验+2年NZ经验+NZ雇主\n- 技工/技术人员路径：针对建筑、制造等技工类\n\n### 2.6 推荐方案D：Green List绿名单 — 紧缺职业快速通道\n\n| 类别 | 路径 | 居留 | 代表职业 |\n|---|---|---|---|\n| Tier 1 | 直通居留（Straight to Residence） | 获认证雇主Tier 1 offer后直接申请RV | 医生、注册护士、专科工程师、ICT安全专家、软件工程师、临床心理学家等 |\n| Tier 2 | 工作转居留（Work to Residence） | 在NZ Tier 2岗位工作满24个月后申请 | 电气工程师、土木工程技师、ICT项目经理、电工、幼教等 |\n| 条件 | 认证雇主+满足薪资中位数+职业注册（如需） | — | — |\n\n### 2.7 路径选择决策树\n\n```\n客户资金能力？\n  ├─ ≥NZD 500万→ AIP Growth / AIP Balanced（投资类型选）\n  ├─ <NZD 500万→ 走技术/职业路径\n  │     ├─ 有博士学历/高收入/6年注册经验？→ SMC 6分制\n  │     ├─ 职业在Green List Tier 1？→ 直通居留（最快）\n  │     ├─ 职业在Green List Tier 2？→ 24月工作转居留\n  │     └─ 其他→ AEWV雇主工签→积累经验→SMC/Green List\n  └─ 结论\n```\n\n---\n\n## 三、合规清理详细方案\n\n### 3.1 资金来源合规——AIP "Fit and Proper Person" 审查\n\n| 环节 | 合规要求 | 风险点 | 执行动作 |\n|---|---|---|---|\n| 资产来源 | 证明所有投资资金合法来源 | 现金收入、代持、未纳税利润 | 提供完整收入/纳税/企业审计记录 |\n| 资金转移 | 通过银行系统转入新西兰 | 地下钱庄、现金搬运 | 优先使用境外已有资产或ODI合规出境 |\n| 投资合规性 | 投资于INZ认可类型 | 不被认可的产品 | 由LIA+金融顾问确认 |\n| 品格审查 | 无犯罪记录 | 任何国家犯罪记录 | 提供所有国家无犯罪证明 |\n| 健康审查 | 体检合格 | 严重健康问题 | 指定医院体检 |\n| 商业背景 | 无破产/商业欺诈 | 商业纠纷 | 如实披露商业经历 |\n| 政治背景 | 非敏感政治人物 | PEP审查 | 如实声明 |\n\n### 3.2 中国国籍边界与PRV的独特性\n\n| 阶段 | 中国国籍状态 | 说明 |\n|---|---|---|\n| 获居民签证(RV) | 中国国籍不变 | 中国护照仍可使用 |\n| 获永久回头PRV | 中国国籍不变 | **PRV≠入籍**，可无限期持有PRV+中国国籍 |\n| 入籍新西兰 | 自动丧失中国国籍（国籍法第9条） | 持新西兰护照 |\n| PRV的核心价值 | 全球唯一可在拥有"永久身份"的同时不放弃原国籍的英语发达国家路径 | 终极身份保险 |\n\n### 3.3 反洗钱与银行KYC\n\n新西兰《反洗钱与反恐怖主义融资法案》（AML/CFT Act 2009）对新西兰银行KYC/AML要求严格：\n\n- 主申请人护照、身份证、户口本、婚姻证明\n- 无犯罪记录（所有居住超12个月国家，近12个月内）\n- 收入证明、完税证明（近3年）\n- 企业审计报告、股权架构图（如有企业主身份）\n- 投资资金来源说明及资金路径图\n- AIP要求：须提供完整的资金来源说明文件（SOF）\n\n---\n\n## 四、身份路径深度规划\n\n### 4.1 新西兰身份路径全景表\n\n| 路径 | 适用人群 | 首次获批 | 续签模式 | 转PRV | 转公民 |\n|---|---|---|---|---|---|\n| AIP Growth | 高净值投资者$500万+ | RV | 无续签（直接RV） | 2年 | 5年 |\n| AIP Balanced | 稳健投资者$1,000万+ | RV | 无续签（直接RV） | 2年 | 5年 |\n| SMC 6分制 | 技能职业+学历+英语 | RV | 无续签（直接RV） | 2年 | 5年 |\n| Green List Tier 1 | 紧缺职业 | RV | 无续签（直接RV） | 2年 | 5年 |\n| Green List Tier 2 | 紧缺职业 | AEWV工签 | 工签→24月→RV | RV后2年 | RV后5年 |\n| AEWV→SMC | 有雇主但暂不满足6分 | AEWV工签 | 积分达标→RV | RV后2年 | RV后5年 |\n\n### 4.2 AIP Growth类别——深度解析\n\n| 维度 | 内容 |\n|---|---|\n| **改革生效** | 2025年4月1日 |\n| **最低投资额** | NZD 500万（Growth类别） |\n| **投资期限** | 至少持有36个月 |\n| **投资类型** | 管理基金、直接投资新西兰企业、私募股权投资、最多20%可配置慈善投资 |\n| **英语要求** | **已取消**（2025年改革） |\n| **年龄限制** | 无明确上限 |\n| **居住要求** | Growth类别可通过更积极的投资行为降低居住时间要求 |\n| **审批流程** | 递交→INZ审理→原则批准(AIP)平均35工作日→6月内完成投资→居民签证(RV)平均36工作日 |\n| **随行家属** | 配偶+24岁以下受养子女 |\n| **转PRV** | 持RV满2年，满足居住/投资/税务居民等条件 |\n| **入籍** | 持居民签证满5年，5年内累计居住1,350天+每年至少240天 |\n| **投资退出** | 36个月（3年）后可退出Growth类别投资 |\n| **移民监** | Growth可通过额外投资（额外$150万NZD直接投资）减至21天/年 |\n\n### 4.3 SMC 6分制——深度解析\n\n| 维度 | 内容 |\n|---|---|\n| **推出时间** | 2023年10月9日（取代原180分制） |\n| **核心机制** | 学历/职业注册/收入分 + 新西兰技能工作经验分 ≥ 6分 |\n| **必备条件** | ①认证雇主(AE)技能工作offer或当前就业 ②薪资≥NZD中位数工资率 ③55岁以下 ④雅思6.5或同等 ⑤健康+品格 |\n| **学历分** | 博士=6分；硕士=5分；荣誉学士/PGD=4分；学士=3分 |\n| **收入分** | 3倍中位数=6分；2倍=4分；1.5倍=3分 |\n| **注册分** | ≥6年注册经验=6分；5年=5分；4年=4分；3年=3分 |\n| **NZ经验分** | 每年=1分（最多3分） |\n| **2026年8月新路径** | ①技能工作经验路径 ②技工/技术人员路径 |\n| **处理速度** | 通常4-6个月（视申请队列） |\n\n### 4.4 Green List Tier 1——直通居留深度解析\n\n| 维度 | 内容 |\n|---|---|\n| **推出时间** | 2022年5月（配合AEWV改革） |\n| **路径名称** | Straight to Residence |\n| **核心条件** | 获认证雇主Tier 1职业的技能工作offer + 满足该职业的学历/注册/薪资要求 |\n| **Tier 1代表职业** | 全科医生(GP)、精神科医生、注册护士、助产士、专科工程师（土木/电气/机械/化学/结构等）、ICT安全专家、软件工程师（≥$120K）、兽医、医学物理师、临床心理学家、心理治疗师等 |\n| **处理速度** | 通常4-8个月 |\n| **优点** | 直接获RV；无投资；无年龄上限（需55岁以下） |\n| **缺点** | 必须在Tier 1清单上且获认证雇主offer |\n\n### 4.5 新西兰公民身份含金量\n\n| 权益 | 内容 |\n|---|---|\n| 新西兰护照 | 全球约190国免签/落地签 |\n| 澳大利亚 | 新西兰公民可自由在澳生活工作（SCV 444特殊类别签证），4年澳居住可申请澳国籍 |\n| 英国 | 英国与新西兰仍保持紧密联系，“新西兰公民在英国有工作权”的讨论持续中 |\n| 加拿大 | 加拿大对新西兰公民有类似澳洲的工作假期/青年流动安排 |\n| 新加坡 | 新西兰护照新加坡免签90天 |\n| 教育 | 公民大学学费更低+可申请学生贷款；部分奖学金 |\n| 社会福利 | 所有公民福利（KiwiSaver、养老金NZ Super、Working for Families等） |\n\n---\n\n## 五、教育规划\n\n### 5.1 新西兰教育体系\n\n| 阶段 | 年数 | 公立（RV/公民） | 国际学生 |\n|---|---|---|---|\n| 幼儿教育(ECE) | 0-5岁 | 20小时免费ECE（3-5岁）/其余付费 | 全费 |\n| 小学(Primary) | 1-8年级 | **免费** | NZD 11,000-15,000/年 |\n| 中学(Secondary) | 9-13年级 | **免费** | NZD 14,000-18,000/年 |\n| 大学 | 3-4年 | 本地学费（约NZD 6,000-10,000/年） | 国际学费（约NZD 25,000-40,000/年） |\n\n### 5.2 新西兰八大名校\n\n| 大学 | QS排名 | 优势专业 |\n|---|---|---|\n| 奥克兰大学 | 前100 | 医学、工程、商科、教育 |\n| 奥塔哥大学 | 前200 | 医学、牙医、生命科学 |\n| 惠灵顿维多利亚大学 | 前250 | 法律、人文、政策研究 |\n| 坎特伯雷大学 | 前300 | 工程、林业 |\n| 怀卡托大学 | 前300 | 管理、计算机 |\n| 梅西大学 | 前300 | 兽医、农业、设计 |\n| 林肯大学 | 前400 | 农业、环境、旅游 |\n| 奥克兰理工大学(AUT) | 前500 | 设计、创意产业、健康科学 |\n\n### 5.3 教育路径推荐\n\n| 子女年龄 | 推荐路径 | 说明 |\n|---|---|---|\n| 0-5岁 | 任何路径均可 | 充裕时间窗口 |\n| 6-12岁 | 最佳入口期 | 免费公立教育+语言适应+NZ完整教育体系 |\n| 13-16岁 | 需加速 | NCEA/NZQA学分体系，需确保衔接 |\n| ≥17岁 | 紧迫 | 成人路径或大学阶段 |\n| ≥24岁 | 不可随行 | 须独立申请 |\n\n---\n\n## 六、财富架构搭建方案\n\n### 6.1 新西兰投资移民财富架构\n\n![新西兰AIP投资移民流程](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzAwIiB3aWR0aD0iMTAwJSIgc3R5bGU9Im1heC13aWR0aDo3MjBweDtmb250LWZhbWlseTpzeXN0ZW0tdWksc2Fucy1zZXJpZiI+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iNiIgcmVmWD0iOCIgcmVmWT0iMyIgb3JpZW50PSJhdXRvIj48cG9seWdvbiBwb2ludHM9IjAgMCw4IDMsMCA2IiBmaWxsPSIjYzgxMDJlIi8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSI3MjAiIGhlaWdodD0iMzAwIiBmaWxsPSIjZmVmYWZhIiByeD0iMTQiLz48dGV4dCB4PSIzNjAiIHk9IjIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjEzIiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjYzgxMDJlIj5BSVAgQWN0aXZlIEludmVzdG9yIFBsdXMo5oqV6LWE56e75rCRKTwvdGV4dD48cmVjdCB4PSI1MCIgeT0iNDUiIHdpZHRoPSIxNTAiIGhlaWdodD0iNTUiIHJ4PSIxMCIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjYzgxMDJlIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjEyNSIgeT0iNjIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iOSIgZm9udC13ZWlnaHQ9IjYwMCI+6LWE6YeR5YeG5aSHTlpENTAw5LiHPC90ZXh0Pjx0ZXh0IHg9IjEyNSIgeT0iNzgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iOSIgZmlsbD0iIzZiNzI4MCI+5ZCI5rOV5p2l5rqQ6K+B5piOPC90ZXh0PjxsaW5lIHgxPSIyMDIiIHkxPSI3MiIgeDI9IjIzOCIgeTI9IjcyIiBzdHJva2U9IiNjODEwMmUiIHN0cm9rZS13aWR0aD0iMS41IiBtYXJrZXItZW5kPSJ1cmwoI2EpIi8+PHJlY3QgeD0iMjQwIiB n  └─ 在NZ开立银行账户（部分银行接受海外税务居民）\n```\n\n### 6.4 新西兰信托——家族传承工具\n\n| 信托类型 | 特点 | 适用场景 |\n|---|---|---|\n| 家庭信托(Family Trust) | 资产保护+代际传承 | 新西兰境内资产 |\n| 离岸信托+新西兰受托人 | 利用新西兰信托法对受益人的保护 | 跨境家族财富 |\n| Foreign Trust（非居民信托） | 非NZ税务居民设立的信托，仅对NZ来源收入征税 | 不在NZ居住的PRV持有者 |\n\n### 6.5 新西兰vs香港税务对比\n\n| 税种 | 新西兰·非税务居民 | 新西兰·税务居民 | 香港 |\n|---|---|---|---|\n| 个税 | 仅NZ来源收入 | 10.5%-39%（全球） | 2%-17%（仅港来源） |\n| 资本利得税 | 无全面CGT | 无全面CGT（bright-line 10年） | 无 |\n| 遗产税 | 无 | 无 | 无（2006年废除） |\n| GST/VAT | 15% | 15% | 无增值税 |\n| 公司税 | 28% | 28% | 8.25%-16.5% |\n| 地域来源原则 | — | 全球征税 | **仅香港来源** |\n\n---\n\n## 七、税务分析\n\n### 7.1 新西兰税务居民判定\n\n| 情形 | 税务判断 | 影响 |\n|---|---|---|\n| 每年在NZ居住≥183天 | 自动为NZ税务居民 | 全球收入申报义务 |\n| 在NZ有"永久住所"(Permanent Place of Abode) | 可能被认定税务居民 | 即使未满183天 |\n| 持RV但不在NZ居住 | 通常不为税务居民 | 仅NZ来源收入需申报 |\n| 持PRV但居住海外 | 通常不为税务居民 | 同RV |\n| 入籍后居住海外 | 通常不为税务居民（除非PPoA） | 同PRV |\n| 过渡税务居民(Transitional Resident) | 新移民前4年部分海外收入免税 | 适用于首次成为NZ税务居民者 |\n\n### 7.2 关键税种详解\n\n| 税种 | 税率 | 说明 |\n|---|---|---|\n| 个人所得税 | 10.5%（$0-$15,600）、17.5%（$15,601-$53,500）、30%（$53,501-$78,100）、33%（$78,101-$180,000）、39%（$180,001+） | 累进 |\n| GST（商品服务税） | 15% | 大部分商品和服务 |\n| 资本利得税 | 无全面CGT | Bright-line test: 投资房产10年内出售征税 |\n| 公司税 | 28% | — |\n| 遗产税 | 无 | — |\n| 赠与税 | 无 | 2011年废除 |\n| 印花税 | 无 | — |\n| FBT（附加福利税） | 视情况 | 雇主提供非现金福利 |\n\n### 7.3 税务风险边界\n\n- **投资≠税务居民**：仅持有RV/PRV但不长期居住通常不是NZ税务居民\n- **过渡税务居民**：前4年免NZ海外收入税（需满足条件）\n- **中新DTA**：减免重复征税，加比规则打破双重居民僵局\n- **对比美国**：新西兰税务框架对不长期居住的投资者更友好（无全球征税）\n- **CFC规则**：新西兰有CFC规则但影响比美国轻得多\n\n---\n\n## 八、福利居住国规划\n\n### 8.1 新西兰居民/PR福利总览\n\n| 福利类别 | 居民签证(RV) | PRV | 入籍 |\n|---|---|---|---|\n| 公立医疗 | 即日享受（公共医疗+残疾服务） | 同左 | 同左 |\n| 子女教育 | **免费**公立K-13+本地大学学费 | 同左 | 同左 |\n| 幼儿教育(ECE) | 3-5岁20小时免费/周 | 同左 | 同左 |\n| 社会福利 | 居住满2-3年后部分福利 | 无等待期 | 同左 |\n| Super养老金 | 65岁+居住满10年（5年在50岁后） | 同左 | 同左 |\n| 就业 | 可为任何雇主工作 | 同左 | 可参公职 |\n| 选举权 | 居住满1年可投票 | 有 | 有 |\n| 旅行 | 受RV旅行条件限制 | **永久回头—无任何限制** | 持NZ护照 |\n| 去澳大利亚 | — | — | 自由在澳生活工作(SCV 444) |\n\n### 8.2 PRV——全球独一无二的永久回头签证\n\n| 特征 | 新西兰PRV | 澳洲PR/RRV | 美国绿卡 | 加拿大PR |\n|---|---|---|---|---|\n| 永久有效 | ✅ **永不过期** | ❌ 每5年续RRV | ❌ 每10年续 | ❌ 每5年需住满2年 |\n| 无居住要求 | ✅ 无 | ❌ 需累计2年/5年 | ⚠️ 离境超1年有风险 | ❌ 需住满2年/5年 |\n| 出入境自由 | ✅ 无限制 | ⚠️ 需有效RRV | ⚠️ 需回美证 | ⚠️ 需有效PR卡 |\n| 不触发国籍问题 | ✅ PRV≠入籍 | ✅ | ✅ | ✅ |\n\n### 8.3 推荐定位\n\n**新西兰 = 高净值家庭的安全备选 + 子女教育优化 + PRV永久回头终极保险 + 入籍后澳洲自由。** 对于不需要"高税率、高竞争、高密度"生活的客户，新西兰提供了一种"从容的身份保障"——拿到PRV后可以回中国继续事业，10年20年后随时可以返回新西兰。\n\n---\n\n## 九、预算明细汇总\n\n### 9.1 AIP Growth类别费用明细（$500万NZD路径）\n\n| 序号 | 费用项目 | 收费机构 | 金额（NZD） | 折合RMB(万) | 付款节点 |\n|---|---|---|---|---|---|\n| 1 | AIP Growth投资本金 | 管理基金/直投企业 | $5,000,000 | 2,250.00 | AIP后6月内 |\n| 2 | INZ申请费（主申） | 移民局 | $4,500-6,000 | 2.03-2.70 | 递交时 |\n| 3 | INZ申请费（配偶+2子女） | 移民局 | $2,000-4,000 | 0.90-1.80 | 递交时 |\n| 4 | 持牌移民顾问费(LIA) | LIA/律所 | $20,000-40,000 | 9.00-18.00 | 签约/分期 |\n| 5 | 体检费（四人） | 指定医生 | $1,600-2,400 | 0.72-1.08 | 递交前 |\n| 6 | 警察无犯罪证明（四人） | 各国公安/翻译 | $400-800 | 0.18-0.36 | 递交前 |\n| 7 | 国内翻译/公证 | 翻译+公证处 | 约RMB 15,000 | 1.50 | 材料阶段 |\n| 8 | 投资管理费（年0.5%-1.5%） | 管理基金 | $25,000-75,000/年 | 11.25-33.75/年 | 每年 |\n| 9 | 律师/信托设立（可选） | 新西兰律所 | $5,000-15,000 | 2.25-6.75 | 如需 |\n| **一次性费用合计** | — | **约NZD 32,500-68,200** | **约17-31** | — |\n| **含投资本金** | — | **约NZD 5,032,500-5,068,200** | **约2,265-2,281** | — |\n\n> 汇率：1 NZD = 4.50 RMB\n\n### 9.2 AIP Balanced类别费用明细（$1,000万NZD路径）\n\n| 序号 | 费用项目 | 金额（NZD） | 折合RMB(万) | 说明 |\n|---|---|---|---|---|\n| 1 | 投资本金 | $10,000,000 | 4,500.00 | 上市股票/债券/房地产型 |\n| 2 | 申请费+顾问+体检+公证 | 约$32,500-68,200 | 约17-31 | 同Growth口径 |\n| 3 | 投资管理费（年0.3%-1%） | $30,000-100,000/年 | 13.50-45.00/年 | 比Growth低 |\n| **一次性费用合计** | **约NZD 32,500-68,200** | **约17-31** | — |\n| **投资锁定期** | **5年** | — | 比Growth多2年 |\n\n### 9.3 SMC 6分制路径费用明细（零投资）\n\n| 序号 | 费用项目 | 金额（NZD） | 折合RMB(万) | 付款节点 |\n|---|---|---|---|---|\n| 1 | INZ居民签证申请费 | $4,500-6,000 | 2.03-2.70 | 递交时 |\n| 2 | 配偶+子女申请费 | $2,000-4,000 | 0.90-1.80 | 递交时 |\n| 3 | 持牌移民顾问费 | $10,000-20,000 | 4.50-9.00 | 签约 |\n| 4 | 学历评估(IQA) | $445-750 | 0.20-0.34 | 递交前 |\n| 5 | 职业注册（如需） | $500-2,000 | 0.23-  动作 | 目的 |\n|---|---|---|\n| 1 | 确认客户预算：$500万 vs $1,000万 NZD | 确定AIP子类别 |\n| 2 | 确认客户投资风险偏好（Growth vs Balanced） | 匹配投资类型 |\n| 3 | 确认客户资金来源和出境路径可行性 | P0合规前提 |\n| 4 | SMC备选：评估客户学历/职业/英语是否满足6分制 | 多路径对比 |\n| 5 | Green List备选：检查客户职业是否在绿名单 | 最低成本方案 |\n| 6 | 联系新西兰持牌移民顾问确认最新政策 | 官方落地确认 |\n| 7 | 评估PRV居住条件是否可满足 | 提前规划 |\n| 8 | 确认子女年龄（24岁红线）+教育规划窗口 | 时间紧迫度 |\n\n---\n\n## 十一、重要风险声明\n\n### 11.1 投资风险\n\n**AIP Growth类别要求投资于管理基金/直接投资等较高风险类型。投资不是存款，本金可能面临损失、流动性风险、汇率风险和管理人风险。** 客户应将其视为"用资金锁定期换取新西兰居民身份"，而非确保本金的储蓄替代品。管理基金的历史表现不代表未来收益。\n\n### 11.2 政策风险\n\n**新西兰移民政策历史上多次调整**：\n- 2022年将投资额从$100万/$300万调整至$500万/$1,500万\n- 2025年4月大幅降至$500万/$1,000万并取消英语\n- 虽然当前对投资者友好，但未来仍可能提高门槛或调整条件\n- 2026年8月SMC将新增两条路径，可能同步调整现有6分制\n- **正式申请前必须由新西兰持牌移民顾问确认最新政策版本**\n\n### 11.3 PRV居住风险\n\n**取得RV后转PRV通常需满足2年居住/投资/税务居民等条件。** 如果客户完全不在新西兰居住且不满足替代条件，可能无法成功申请PRV。AIP申请人可通过额外投资$150万NZD（直接投资）将居住要求降至21天/年。\n\n### 11.4 税务风险\n\n**取得RV不等于自动成为NZ税务居民。** 但如果客户在NZ长期居住（≥183天/年），将触发全球收入申报义务。不在NZ居住的投资者通常不受NZ全球征税影响（仅NZ来源收入需申报）。过渡税务居民(TR)前4年豁免部分海外收入税。\n\n### 11.5 国籍风险\n\n**入籍新西兰后根据《中国国籍法》第9条自动丧失中国国籍。但持有PRV不触发此条款。** 客户可选择永久持有PRV而不入籍——这在所有英语发达国家中独一无二。\n\n### 11.6 资金出境风险\n\n**NZD 500万-1,000万（约RMB 2,250万-4,500万）属于大额资金出境**，任何地下钱庄、虚假贸易、现金搬运都是P0红区。本方案必须以可解释、可追踪、可留痕的资金路径为前提。ODI路径是目前最合规的选择。\n\n### 11.7 汇率风险\n\n**NZD/RMB汇率波动可能显著影响实际投资成本。** 以NZD/RMB从4.20到4.50的波动为例，$500万NZD投资的RMB金额会从2,100万变化到2,250万——差距达150万RMB。建议客户在汇率有利时完成换汇和投资。\n\n### 11.8 医疗风险\n\n**新西兰公立医疗虽免费但存在等待时间较长的问题。** 非紧急手术可能轮候数月。建议购买私人医疗保险（Southern Cross等），年保费约NZD $1,000-3,000/人。\n\n---\n\n## 附件：引用法律法规与项目资料来源\n\n### A. 法律依据清单\n\n| 法案/规则 | 条款 | 本次用途 | 更新日期 | 备注 |\n|---|---|---|---|---|\n| Immigration Act 2009 (NZ) | 全文 | 新西兰移民法上位法 | 现行有效 | 所有签证类别的法律基础 |\n| Immigration (Visa, Entry Permission, and Related Matters) Regulations 2010 | 全文 | 各类签证具体要求和申请流程 | 持续修订 | 操作法规 |\n| AIP Active Investor Plus改革 | 2025.4.1生效 | 降低投资门槛至$500万/$1,000万、取消英语、扩大投资范围 | 2025-04-01 | 本次主方案依据 |\n| Skilled Migrant Category (6分制) | 2023.10.9起 | 新评分体系替代原180分制 | 2023-10-09 | 技术移民路径 |\n| SMC 2026年8月新增路径公告 | 技能工作经验+技工路径 | SMC补充路径 | 2026-08（预告） | 待正式实施 |\n| Green List移民路径 | Tier 1/Tier 2 | 紧缺职业快速居留 | 持续更新 | IT/工程/医疗/教育等 |\n| AEWV Accredited Employer Work Visa | 2022.7.4起 | 雇主认证工签框架 | 持续修订 | 雇主资质要求 |\n| NZ Income Tax Act 2007 | 全文 | 个税/公司税/CGT等 | 现行有效 | 税务分析依据 |\n| New Zealand Superannuation and Retirement Income Act 2001 | — | NZ Super养老金资格 | 现行有效 | 65岁+10年居住 |\n| 《中华人民共和国国籍法》 | 第3条、第9条 | 双重国籍禁止 | 现行有效 | 入籍风险 |\n| 中新避免双重征税协定(DTA) | 全文 | 税务居民判定+减免重复征税 | 2019年修订 | 双边税务适用 |\n| AML/CFT Act 2009 (NZ) | 全文 | 反洗钱/反恐融资 | 现行有效 | 银行KYC依据 |\n\n### B. 法案/政策相互影响\n\n| 组合 | 相互影响 | 需注意 |\n|---|---|---|\n| AIP 2025改革+取消英语 | 门槛降低+语言移除→申请可能激增 | 可能导致未来政策收紧或配额限制 |\n| RV→PRV→入籍 | 持RV满2年→PRV（永久），满5年→入籍（需居住） | PRV是中途站，入籍是终站 |\n| PRV+不入籍 | PRV无居住限制可永久持有 | **核心差异化价值** |\n| NZ公民+澳大利亚 | NZ公民自由在澳工作（SCV 444），4年居住可申请澳籍 | 变相"NZ+AU双通道" |\n| 中新DTA+非税务居民 | 不在NZ居住的投资者通常不触发全球征税 | 持有RV但居住中国≠NZ税务居民 |\n| SMC 6分制+2026年8月新路径 | 新路径可能同时收紧现有6分制审查标准 | 建议在2026年8月前完成SMC通道评估 |\n| Green List+年度更新 | 绿名单职业每年可能调整 | 申请前需确认职业仍在清单上 |\n| NZ投资+中国国籍 | 持有RV/PRV期间中国国籍不变 | 入籍是唯一触发国籍丧失的节点 |\n\n### C. 法律适用注意事项\n\n1. **所有费用以签约方合同为准**：本方案预算为参考口径，实际费用以新西兰持牌移民顾问合同、INZ最新收费、银行账单为准\n2. **AIP投资合规须由LIA+金融顾问确认**：投资产品必须在INZ认可清单上\n3. **SOF(source of funds)是AIP审批核心**：资金来源文件不充分是申请被拒的首因\n4. **SMC 6分制中NZQA学历评估耗时3-6周**：需提前启动\n5. **PRV居住替代方案**：AIP申请人可通过额外投资满足PRV条件\n6. **入籍1,350天计算**：5年内累计，每年至少240天——需从获批RV之日起规划居住时间\n7. **子女24岁红线**：申请时须未满24岁且经济上依赖主申请人\n8. **最终落地前三方确认**：LIA确认申请资格、会计师确认资金来源合规、税务师确认税务居民规划\n\n### D. 交付前客户确认清单\n\n1. 客户完整家庭信息与随行成员名单（含所有24岁以下受养子女）\n2. 主申请人及随行成员护照、身份证、户口本、婚姻/出生证明\n3. 资金来源证明：纳税记录、企业审计报告、资产变现文件、银行流水\n4. 新西兰持牌移民顾问出具的最新AIP投资合规确认和费用明细\n5. 客户投资风险偏好书面确认（Growth vs Balanced）\n6. SMC备选评估：学历认证(IQA)、英语考试、职业评估（如需）\n7. Green List备选评估：职业是否在Tier 1/Tier 2清单\n8. 所有国家无犯罪记录\n9. PRV条件确认：是否可满足2年居住/投资/税务居民条件\n10. 子女教育路径意向（NZ公立/国际学校/海外升学）\n';
