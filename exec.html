## 摘要结论

本版优先推荐 **SMC六分制技术移民**，其次推荐 **Green List绿名单/ICT直通或工作转居留**，AIP Active Investor Plus 仅作为高净值客户备选。

官网现行口径显示：AIP目前仍适用，分为 **Growth类别 NZD 500万、至少3年** 与 **Balanced类别 NZD 1000万、至少5年**。因此AIP不是失效项目，但对普通客户不是首推；若客户具备学历、职业、英语和雇主offer，六分制/绿名单更轻、更可控。

---

### 1.1 根本判断

客户真正需要的不是“买身份”，而是在英语国家中获得可长期保留的家庭安全垫。新西兰的核心优势是：RV后可转PRV永久回头签；而技术移民/绿名单比AIP更轻资产、更低成本。

---

## 二、核心策略

### 2.1 路径优先级

| 优先级 | 路径 | 推荐理由 | 适合人群 |
|---|---|---|---|
| A | SMC六分制 | 无投资、直接RV、规则清晰 | 有学历/高收入/注册职业+雇主offer |
| B | Green List ICT/紧缺职业 | 可直通或24月转居留 | 软件、ICT安全、开发、通信等 |
| C | AEWV→SMC/Green List | 先工签入境再转身份 | 暂未达6分但能拿offer |
| D | AIP Growth/Balanced | 官网仍适用但资金门槛高 | 高净值家庭 |

### 2.2 为什么六分制优先

1. 不占用NZD 500万-1000万投资本金。  
2. 获批即居民签证RV，后续可转PRV。  
3. 对年轻、高学历、ICT/工程/医疗/教育人才尤其友好。  
4. 与客户“事业仍在中国、身份作为备选”的定位更匹配。

---

## 三、合规清理

| 合规项 | 要求 | 风险 |
|---|---|---|
| 学历真实性 | 学历、成绩、认证一致 | 虚假学历直接拒签 |
| 工作经验 | 推荐信、社保、个税、合同一致 | 年限断裂影响分数 |
| 雇主offer | 必须为认证雇主、真实岗位 | 虚假岗位/挂靠高风险 |
| 英语成绩 | 官方认可考试、有效期内 | 成绩过期需重考 |
| 资金来源 | AIP需完整SOF | 地下钱庄为P0风险 |
| 无犯罪/体检 | 所有成年申请人 | 健康/品格不符可拒 |

---

## 四、境外资金归集与投资架构

技术移民路径不需要大额投资，仅需安家资金；AIP路径需证明NZD 500万/1000万合法来源并通过银行系统投资。

| 路径 | 资金安排 |
|---|---|
| SMC/Green List | 准备首年生活费、租房、教育、保险预算 |
| AEWV工签 | 以雇主薪资为主要资金来源证明 |
| AIP Growth | 境外资产归集→新西兰认可管理基金/直投 |
| AIP Balanced | 境外资产归集→债券、上市股票、房地产型投资等 |

---

## 五、投资/职业使用建议

### 5.1 SMC六分制准备

| 模块 | 建议 |
|---|---|
| 学历 | 博士6分、硕士5分、本科3分；海外学历提前做NZQA |
| 工作 | 争取认证雇主全职offer，薪资不低于中位数或指定门槛 |
| 英语 | 提前准备雅思/PTE，避免offer到手后卡语言 |
| NZ经验 | 若不足6分，可通过1-3年NZ经验补足 |

### 5.2 Green List / ICT准备

重点关注软件工程师、开发程序员、ICT安全专家、数据库管理员、通信网络工程师等。部分ICT岗位有固定年薪门槛，常见参考为NZD 120,000级别，最终以官网清单和LIA确认为准。

### 5.3 AIP官网现行判断

AIP仍适用：Growth要求至少NZD 500万可接受投资，Balanced要求至少NZD 1000万可接受投资；Growth偏管理基金/直接投资，Balanced可包含更混合型投资。对客户而言，AIP适合“资金充足但无技术/职业路径”的备选。

## 十、教育规划

新西兰RV/PRV子女可享受本地学生待遇：公立中小学免费，大学按本地学费。若子女年龄在6-16岁，新西兰是兼顾英语环境、教育安全和生活质量的优质目的地。

---

## 十一、福利规划

| 福利 | RV/PRV权益 | 说明 |
|---|---|---|
| 公立医疗 | 可享受 | 排队较长，建议配置商业保险 |
| 公立教育 | 子女免费 | K-13公立教育免费 |
| PRV永久回头 | 核心优势 | 无居住限制，长期保留身份 |
| NZ Super | 满65岁且符合居住年限 | 需满足10年居住等条件 |

---

## 十二、预算明细

| 路径 | 投资本金/门槛 | 办理费用参考 | 说明 |
|---|---:|---:|---|
| SMC六分制 | 无投资 | NZD 1.9-3.5万 | 学历认证、英语、顾问、体检公证 |
| Green List/ICT | 无投资 | NZD 1.4-2.5万 | 职业注册/雇主offer/居留申请 |
| AEWV→居留 | 无投资 | NZD 1-2万+安家费 | 先工签后转 |
| AIP Growth | NZD 500万 | NZD 3-7万+管理费 | 3年锁定 |
| AIP Balanced | NZD 1000万 | NZD 3-7万+管理费 | 5年锁定 |

---

## 十三、执行时间轴

| 路径 | 关键步骤 | 周期 |
|---|---|---|
| SMC六分制 | 学历/英语/offer→EOI→ITA→RV | 6-12个月 |
| Green List Tier 1 | 职业资格→认证雇主offer→直通居留 | 4-8个月 |
| Green List Tier 2 | AEWV→工作24个月→Work to Residence | 24个月+ |
| AIP Growth/Balanced | SOF→原则批准→投资→RV→PRV | 6-12个月获RV，2年后PRV |

## 十四、风险声明与法律附件

1. SMC/Green List最终以INZ官网和持牌移民顾问意见为准。  
2. ICT岗位清单和薪资门槛会调整，递交前必须逐项核验。  
3. AIP当前仍适用，但投资不是保本产品，存在本金、汇率和流动性风险。  
4. PRV不等于入籍；入籍新西兰将触发中国国籍风险。  
5. 长期居住新西兰可能触发全球征税，需提前规划税务居民身份。  
6. 资金出境必须合规，严禁地下钱庄、虚假贸易和第三方不明代付。
