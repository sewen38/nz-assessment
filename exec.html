function mdToHtml(md){var lines=String(md||'').replace(/\r\n/g,'\n').split('\n'),html='',inList=false,inTable=false,table=[];function closeList(){if(inList){html+='</ul>';inList=false}}function closeTable(){if(!inTable)return;html+='<div class="table-wrap"><table>';for(var i=0;i<table.length;i++){var cells=table[i].split('|').slice(1,-1).map(function(c){return c.trim()});if(i===1&&cells.every(function(c){return /^:?-{3,}:?$/.test(c)}))continue;html+='<tr>'+(i===0?cells.map(function(c){return '<th>'+inlineMd(c)+'</th>'}).join(''):cells.map(function(c){return '<td>'+inlineMd(c)+'</td>'}).join(''))+'</tr>'}html+='</table></div>';inTable=false;table=[]}for(var i=0;i<lines.length;i++){var line=lines[i].trimEnd();if(!line){closeList();closeTable();continue}if(/^```/.test(line)){continue}if(/^\|.*\|$/.test(line)){closeList();inTable=true;table.push(line);continue}closeTable();if(/^#{1,6}\s+/.test(line)){closeList();var lv=line.match(/^#{1,6}/)[0].length;html+='<h'+lv+'>'+inlineMd(line.replace(/^#{1,6}\s+/,''))+'</h'+lv+'>';continue}if(/^[-*]\s+/.test(line)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}closeList();html+='<p>'+inlineMd(line)+'</p>'}closeList();closeTable();return html}

function buildPlan(){
 var issue=q('issue')||'未关联';var solution=q('solution')||'A';var project=q('project')||'nz-aip-growth';var projectName=projectMap[project]||project;

 document.getElementById('summary').innerHTML='本执行策划案按客户交付版模板生成，包含客户信息确认、核心策略、合规清理、资金路径、身份路径（AIP/SMC 6分制/Green List/AEWV）、教育规划、福利规划、预算明细、执行时间轴、风险声明和法律依据。新西兰是当前少数仍保留活跃投资移民路径的英语发达国家，且拥有全球唯一的"永久回头签证（PRV）"。';
 var md=`# 新西兰投资移民执行策划案\n\n> 生成日期：2026-06-08  \n> 适用对象：拟通过新西兰Active Investor Plus（AIP）投资移民或技术移民路径取得居民/永居身份的高净值家庭/企业主  \n> 文档版本：客户交付版 V1.0  \n> 重要声明：本策划案为商业规划与执行框架，不构成法律、税务、投资或移民建议；落地前须由新西兰持牌移民顾问（Licensed Immigration Adviser）或移民律师进行最终确认。\n\n---\n\n## 摘要结论\n\n**新西兰是当前全球唯一仍保留活跃投资移民项目的英语发达国家（2025年4月1日重大改革后门槛大幅降低），同时拥有全球唯一的"永久回头签证（PRV）"——取得后无任何居住和出入境限制。**\n\n本方案提供三条主路径：\n\n**第一，Active Investor Plus（AIP）投资移民** — 2025年4月1日改革后门槛大幅降低：Growth类别最低NZD 500万（约2,250万人民币），至少持有3年；Balanced类别NZD 1,000万，至少持有5年。取消英语要求，扩大可接受投资范围，处理速度大幅提升（原则批准平均35个工作日）。申请人获批后获得居民签证（Resident Visa），2年后可申请PRV（永久回头）。\n\n**第二，技术移民SMC 6分制** — 基于学历/职业注册/收入+新西兰工作经验累计6分，55岁以下，有认证雇主技能工作offer，英语雅思6.5。2026年8月将推出新的技能工作经验路径和技工/技术人员路径。\n\n**第三，Green List绿名单路径** — Tier 1（直通居留）和Tier 2（工作2年转居留），覆盖医疗、工程、ICT、教育等紧缺职业。\n\n本方案的执行重点：第一，AIP Growth类别当前门槛大幅降低，且取消英语要求，是英语国家投资移民的"窗口期"；第二，新西兰居民签证2年后可申请PRV——全球唯一永久回头签，是最高含金量的"身份保险"；第三，取得Resident Visa后即可享受免费公立医疗和子女免费教育；第四，5年后可入籍新西兰，新西兰护照含金量极高（全球免签/落地签约190国）。\n\n## 一、客户家庭基本信息（待补充版）\n\n### 1.1 已知/默认信息\n\n| 项目 | 当前信息 | 状态 |\n|---|---|---|\n| 客户身份 | 中国籍家庭/企业主/高净值客户 | ⚠️ 待确认 |\n| 核心目标 | 取得第二身份/永居、全球流动性、子女教育、安全备选 | ⚠️ 待确认 |\n| 预算范围 | AIP Growth类别: NZD 500万（约2,250万RMB）起；Balanced类别: NZD 1,000万起 | ✅ 已知政策门槛 |\n| 家庭成员 | 主申请人、配偶、受养子女可随行（24岁以下的受养子女） | ⚠️ 待确认 |\n| 英语能力 | AIP已取消英语要求；SMC需雅思6.5 | ⚠️ 待确认 |\n| 投资意愿 | Growth类别要求投资管理基金/直接投资等较高风险类型；Balanced类别可含债券/房地产型投资 | ⚠️ 待确认风险偏好 |\n| 是否计划在新西兰居住 | AIP可降低居住要求；但转PRV通常需满足居住/投资等条件 | ⚠️ 待确认 |\n| 资金来源 | NZD 500-1,000万资金来源须合法、可追踪 | ❌ 待确认 |\n| 税务身份 | 中国税务居民为默认假设；拿到居民签证后如长期居住新西兰将触发新西兰税务居民 | ⚠️ 待确认 |\n\n### 1.2 待解决问题分级\n\n| 编号 | 问题 | 严重度 | 说明 |\n|---|---|---|---|\n| Q1 | 客户能否满足NZD 500万/Growth类别的投资门槛？ | P1 | 2025年改革后门槛大幅降低，但仍是较高金额。 |\n| Q2 | 客户能否接受Growth类别的较高风险投资类型（管理基金/直接投资）？ | P1 | 如果偏好低风险，需走Balanced类别NZD 1,000万。 |\n| Q3 | 资金出境路径是否合法 | P0 | NZD 500万+资金必须合规出境。 |\n| Q4 | 客户年龄是否在55岁以下（SMC路径）？ | P1 | SMC 6分制有55岁上限（2026年8月新路径除外）。 |\n| Q5 | PRV的居住要求是否能满足？ | P1 | 通常需满足2年居住或投资等条件才能申请PRV。 |\n| Q6 | 是否有新西兰雇主/Green List职业背景？ | P2 | 如AIP投资门槛过高，技术/绿名单路径为替代。 |\n\n### 1.3 根本判断\n\n**表面问题**：客户想移民新西兰。  \n**真实问题**：新西兰是当前英语发达国家中最具吸引力的投资移民目的地之一——AIP改革后门槛降低（从NZD 1,500万降至500万）、取消英语、PRV永久回头、居民福利即刻享受、入籍后可去澳洲自由生活工作。适合以"长期安全备选"、"未来养老"和"子女教育"为核心目标的高净值家庭。与澳洲188关停、英国Tier 1关闭形成鲜明对比，新西兰目前是英语国家的"投资移民绿洲"。\n\n---\n\n## 二、核心策略\n\n### 2.1 三路径对比定位\n\n| 维度 | AIP Growth | SMC 6分制 | Green List Tier 1 |\n|---|---|---|---|\n| 适合人群 | 高净值投资者（NZD 500万+） | 有技能职业+英语+学历 | 紧缺职业（医疗/工程/ICT等） |\n| 是否需要投资 | NZD 500万，3年锁定 | 无 | 无 |\n| 是否需要雇主 | 无 | 认证雇主+技能offer | 认证雇主+Tier 1职业offer |\n| 年龄限制 | 无明确上限 | 55岁以下 | 55岁以下 |\n| 英语要求 | 已取消 | 雅思6.5 | 视职业要求 |\n| 签证类型 | 居民签证（Resident Visa） | 居民签证 | 居民签证 |\n| 转PRV | 2年（满足居住/投资） | 2年（满足居住） | 2年 |\n| 入籍 | 5年居住（1,350天+每年240天） | 同左 | 同左 |\n\n### 2.2 推荐核心路线\n\n**推荐方案A：新西兰Active Investor Plus（Growth类别）→ NZD 500万投资 → 居民签证 → 2年转PRV → 5年入籍。**\n\n理由：\n1. **门槛已降**：2025年4月1日改革后，最低投资额从NZD 1,500万降至500万，幅度巨大。\n2. **已取消英语**：改革取消了英语能力要求，对中国高净值家庭是重大利好。\n3. **PRV永久回头**：全球独一无二——取得后无任何居住和出入境限制，是终极"身份保险"。\n4. **福利即刻享受**：获批居民签证后即刻享受免费公立医疗（公共医疗和残疾服务）和子女免费K-12教育。\n5. **新西兰护照含金量高**：全球约190国免签/落地签，入籍后可自由在澳大利亚生活工作（SCV 444签证，4年可申请澳籍）。\n6. **处理速度快**：原则批准平均35个工作日，完成投资后居民签证平均36个工作日。\n\n**备选方案B：SMC 6分制技术移民** — 如有博士学位+新西兰雇主offer，可直接满足6分，无需投资。\n\n---\n\n## 三、合规清理详细方案\n\n### 3.1 资金来源合规\n\n新西兰对AIP申请人执行"Fit and Proper Person"审查，包括资金来源合法性。\n\n| 环节 | 合规要求 | 风险点 | 执行动作 |\n|---|---|---|---|\n| 资金来源 | 须证明所有投资资金来自合法来源 | 现金收入、代持、非法换汇 | 准备收入证明、纳税记录、企业文件、资产变现凭证 |\n| 资金转移 | 须通过银行系统将资金转入新西兰 | 地下钱庄、现金搬运 | 优先使用境外已有资产、合法汇款路径 |\n| 投资合规 | 资金须投资于INZ认可的投资类型 | 投资于不被认可的产品 | 由持牌移民顾问和金融顾问确认投资合规性 |\n| Fit and Proper审查 | 申请人须通过品格审查 | 犯罪记录、不合规商业行为 | 准备所有国家无犯罪记录 |\n| 健康和品行 | 须通过体检和品格证明 | 健康问题、信息不实 | 如实申报 |\n\n### 3.2 中国国籍边界\n\n红线：取得新西兰居民签证后，中国护照仍可使用。入籍新西兰后根据《中国国籍法》第9条自动丧失中国国籍。\n\n但新西兰的PRV（永久回头签证）提供了一个独特的"中间态"：\n- **持居民签证(RV)**满足居住/投资等条件后申请PRV——PRV无任何居住和出入境限制，可以永久持有，不需要续期。\n- **PRV ≠ 入籍**，因此客户可以无限期持有PRV而不触发中国国籍法第9条。\n- 这是新西兰独有的含金量：全球唯一可以在拥有"永久身份"的同时不放弃中国国籍的英语发达国家路径。\n\n---\n\n## 四、身份路径规划\n\n### 4.1 主推荐路径：Active Investor Plus (Growth)\n\n| 维度 | 内容 |\n|---|---|\n| 改革日期 | 2025年4月1日（重大降低门槛） |\n| 最低投资额 | NZD 500万（Growth）；NZD 1,000万（Balanced） |\n| 投资期限 | Growth: 至少36个月；Balanced: 至少60个月 |\n| 投资类型 | Growth: 管理基金、直接投资新西兰企业、最多20%慈善投资 |\n| 英语要求 | 已取消（2025年改革） |\n| 居住要求 | Growth类可通过更积极投资降低居住时间要求 |\n| 签证类型 | 原则批准(AIP)→完成投资→居民签证(Resident Visa) |\n| 随行家属 | 配偶和受养子女 |\n| 转PRV | 持有居民签证满2年，满足居住/投资/税务居民等条件 |\n| 入籍 | 持居民签证满5年，5年内累计1,350天，每年至少240天 |\n| 处理速度 | AIP平均35个工作日，完成投资后居留平均36个工作日 |\n| 申请热度 | 截至2026年5月，已收730份申请（2,390名申请人），Growth类608份 |\n\n### 4.2 备选路径：SMC技术移民6分制\n\n| 维度 | 内容 |\n|---|---|\n| 核心机制 | 学历/职业注册/收入分 + 新西兰工作经验分 ≥ 6分 |\n| 分数举例 | 博士6分（无需工作经验）；硕士5分+1年NZ经验=6分 |\n| 年龄 | 55岁以下 |\n| 英语 | 雅思6.5或同等 |\n| 薪资要求 | NZD $35/小时起（中位数，2026年口径） |\n| 签证类型 | 居民签证（Resident Visa） |\n| 2026年8月新路径 | ①技能工作经验路径（5年经验+2年NZD+NZ雇主）②技工/技术人员路径 |\n\n### 4.3 备选路径：Green List绿名单\n\n| 类别 | 路径 | 条件 |\n|---|---|---|\n| Tier 1 | 直通居留 | 获认证雇主Tier 1职业offer+满足薪资/注册/学历 |\n| Tier 2 | 工作转居留 | 在NZ Tier 2岗位工作满24个月后申请 |\n| 常见方向 | 医疗、工程（土木/电气/机械）、ICT（软件/安全/架构）、教育、建筑 | — |\n\n### 4.4 备选路径：AEWV→转居留\n\nAEWV（雇主认证工签）本身不是居留，但可用于积累SMC工作经验分数或满足Green List Tier 2的24个月要求。AEWV持有者可通过SMC 6分制或Green List路径转居留。\n\n### 4.5 新西兰入籍条件\n\n| 维度 | 内容 |\n|---|---|\n| 居住要求 | 持居民签证满5年 |\n| 物理居住 | 5年内累计至少1,350天，每年至少240天 |\n| 其他 | 品行良好、有基本英语能力 |\n| 入籍后价值 | 新西兰护照全球约190国免签；可自由在澳大利亚生活工作 |\n\n---\n\n## 五、教育规划\n\n新西兰PR/公民子女教育福利：\n\n| 教育阶段 | 居民签证/公民优势 |\n|---|---|\n| 公立中小学(1-13年级) | 免费教育 |\n| 大学本科 | 本地学费（约国际生的1/3-1/2），可申请学生贷款和生活津贴 |\n| 研究生 | 本地学费，研究奖学金 |\n| 新西兰八大 | 奥克兰大学(QS世界前100)、奥塔哥大学等国际认可 |\n\n建议：如果客户子女年龄较小（<15岁），新西兰教育路径的长期价值显著——免费优质公立教育+本地大学学费，同时在安全、纯净的环境中成长。新西兰教育体系受英联邦认可，也方便后续去澳洲或英国深造。\n\n---\n\n## 六、新西兰居民/PR福利与居住规划\n\n### 6.1 福利总览\n\n| 福利类别 | 居民签证(RV) | PRV | 入籍 |\n|---|---|---|---|\n| 医疗 | 即日起享受公共医疗和残疾服务 | 同左 | 同左 |\n| 教育 | 子女免费公立K-13；大学本地学费 | 同左 | 同左 |\n| 社会福利 | 居住满2-3年后可申请部分福利（失业、住房、育儿等） | 无等待期 | 同左 |\n| 养老金(NZ Super) | 65岁+居住满10年（5年在50岁后） | 同左 | 同左 |\n| 就业 | 可为任何雇主工作 | 同左 | 可参公职 |\n| 选举权 | 居住满1年可投票 | 有投票权 | 有 |\n| 旅行 | 受旅行条件限制（通常2年） | **永久回头——无任何限制** | 持新西兰护照 |\n| 去澳大利亚 | — | — | 自由在澳生活工作(SCV 444) |\n\n### 6.2 PRV——全球唯一的永久回头签证\n\n这是新西兰最独特的名片：\n\n- 取得居民签证后满足居住/投资等条件（通常2年），可申请PRV。\n- **PRV无任何居住要求、无任何出入境限制、永不过期。**\n- 客户可以拿到PRV后返回中国继续生活事业，10年20年后仍可返回新西兰。\n- 对比：澳洲PR每5年需续期RRV、美国绿卡离境超1年有风险、加拿大PR需每5年住满2年。\n- **PRV = 不放弃中国国籍的前提下的"终极身份保险"。**\n\n### 6.3 推荐定位\n\n**新西兰 = 高净值家庭的安全备选 + 子女教育优化 + PRV永久回头终极保险 + 入籍后澳洲自由。** 对于不需要"高税率、高竞争、高密度"生活的客户，新西兰提供了一种"从容的身份保障"。\n\n---\n\n## 七、税务分析\n\n### 7.1 新西兰税务居民判断\n\n| 情形 | 税务判断 |\n|---|---|\n| 每年在NZ居住≥183天 | 自动为新西兰税务居民 |\n| 在NZ有"永久住所" | 可能被认定为税务居民 |\n| 持居民签证但不在NZ居住 | 通常不为税务居民（如主要居所/经济联系在海外） |\n| 过渡税务居民 | 新移民前4年可能有过渡优惠 |\n\n### 7.2 关键税种\n\n| 税种 | 税率 | 说明 |\n|---|---|---|\n| 个人所得税 | 10.5%-39%（累进） | 最高档$180,000+ |\n| GST（增值税） | 15% | 大部分商品和服务 |\n| 资本利得税 | 无全面CGT | 部分资产（如投资房产bright-line test：10年内出售征税） |\n| 公司税 | 28% | — |\n| 遗产税 | 无 | — |\n\n### 7.3 税务风险边界\n\n- 新西兰无全面资本利得税、无遗产税、无印花税，对投资者相对友好。\n- 如只投资/持有居民签证但不长期居住，通常不是新西兰税务居民——**投资不等于税务居民**。\n- 新西兰与中国的DTA（双边税务协定）可减免一定重复征税。\n- 对比美国全球征税，新西兰的税务框架对不长期居住的投资者明显更友好。\n\n---\n\n## 八、预算明细汇总\n\n### 8.1 AIP Growth类别基础预算\n\n| 项目 | 金额/口径 | 是否必须 | 说明 |\n|---|---:|---|---|\n| 投资款 | NZD 500万 | 必须 | Growth类别最低投资额，至少持有3年。 |\n| 投资管理费 | 视管理基金而定 | 视投资类型 | 管理基金通常有管理费和业绩费。 |\n| 移民顾问费 | NZD 20,000-40,000 | 推荐 | 新西兰持牌移民顾问（LIA）。 |\n| 签证申请费 | NZD 4,500起（2025年口径） | 必须/官方 | INZ收取，随家属人数增加。 |\n| 体检费 | NZD 400-600/人 | 必须 | 指定医生。 |\n| 警察证明 | NZD 100-200/人 | 必须 | 各国无犯罪记录。 |\n| 翻译/公证 | RMB 10,000-20,000 | 必须 | 中国文件翻译公证。 |\n| 银行/资金转移费 | 视路径 | 必须 | 银行电汇或合规转移费用。 |\n| 服务费 | 按内部报价 | 视服务模式 | — |\n\n### 8.2 费用合计预估（人民币万元）\n\n> 估算口径：按主申请人家庭四人，走AIP Growth类别；汇率暂按 \`1 NZD = 4.50 RMB\`；实际以付款日汇率为准。\n\n| 费用类别 | 外币金额 | 折合人民币（万元） | 说明 |\n|---|---:|---:|---|\n| AIP投资本金 | NZD 5,000,000 | 2,250.00 | Growth最低投资额，锁定期36个月。 |\n| 移民顾问费 | NZD 30,000 | 13.50 | 推荐全流程代理。 |\n| 签证申请费 | NZD 6,000（四人） | 2.70 | 含家属。 |\n| 体检+警察证明 | NZD 2,500（四人） | 1.13 | 按家庭估算。 |\n| 国内翻译/公证 | 约RMB 15,000 | 1.50 | — |\n| **合计费用性支出** | — | **~18.83** | 不含投资本金。 |\n| **合计（含投资本金）** | — | **~2,268.83** | 投资本金锁定3年后可退出。 |\n\n### 8.3 SMC 6分制预算对比（无需投资）\n\n| 项目 | 外币金额 | 折合RMB（万元） |\n|---|---:|---:|\n| 签证申请费 | NZD 5,000-7,000 | 2.25-3.15 |\n| 职业评估/学历认证 | NZD 1,000-2,000 | 0.45-0.90 |\n| 移民顾问费 | NZD 10,000-20,000 | 4.50-9.00 |\n| 体检+警察证明 | NZD 1,000-2,000 | 0.45-0.90 |\n| **合计** | NZD 17,000-31,000 | **~7.65-13.95** |\n\n---\n\n## 九、执行时间轴\n\n### 9.1 AIP Growth标准执行路径\n\n| 时间 | 动作 | 责任方 | 交付物 |\n|---|---|---|---|\n| 第1-2周 | 客户信息收集、家庭结构确认、AIP资质评估 | 顾问+客户 | 客户信息表 |\n| 第2-4周 | 移民顾问确认投资合规性：认可的投资类型和产品 | LIA+客户 | 投资方案 |\n| 第2-6周 | 资金来源文件准备：纳税记录、银行流水、企业文件 | 客户+会计师 | SOF文件包 |\n| 第4-8周 | 完成资金转移安排（境外账户→新西兰） | 客户+银行 | 资金到账 |\n| 第6-10周 | 递交AIP居留申请（含全套材料） | LIA | 申请回执 |\n| 第10-16周 | INZ审理 → 原则批准（Approval in Principle） | INZ+LIA | AIP通知 |\n| AIP后6个月内 | 完成投资（NZD 500万转入认可的投资产品） | 客户 | 投资证明 |\n| 投资完成后 | INZ批准居民签证（Resident Visa） | INZ+LIA | 居民签证 |\n| 获RV后 | 维持投资36个月+满足居住/投资等条件 | 客户 | — |\n| RV满2年后 | 申请PRV（永久回头签证） | LIA+客户 | PRV |\n| RV满5年后 | 如符合入籍条件，可申请新西兰公民 | 客户 | 新西兰护照 |\n\n### 9.2 详细办理流程图\n\n\`\`\`text\n客户确认AIP Growth路径\n      ↓\n移民顾问评估资格 + 投资合规性\n      ↓\n资金来源证明（SOF）编制\n      ↓\n资金转移至新西兰\n      ↓\n递交AIP居留申请\n      ↓\nINZ审理（平均35个工作日）\n      ↓\n原则批准（Approval in Principle）\n      ↓\n6个月内完成NZD 500万投资\n      ↓\nINZ批准居民签证\n      ↓\n维持投资36个月（Growth类别）\n      ↓\nRV满2年后申请PRV\n      ↓\nPRV获批 — 永久回头签证\n      ↓\n（可选）第5年申请入籍\n\`\`\`\n\n### 9.3 本周立即行动清单\n\n| 编号 | 动作 | 目的 |\n|---|---|---|\n| 1 | 确认客户预算：NZD 500万 vs NZD 1,000万 | 确定AIP类别 |\n| 2 | 确认客户风险偏好：Growth（高风险私募/管理基金） vs Balanced（低风险债券+房地产型） | 明确投资方向 |\n| 3 | 确认客户资金来源和出境路径 | 排除P0合规风险 |\n| 4 | 确认是否需要同步评估SMC 6分制（如客户有学历+英语+技能职业） | 多路径对比 |\n| 5 | 联系新西兰持牌移民顾问确认最新政策 | 官方落地确认 |\n| 6 | 评估客户是否需要在新西兰居住以满足PRV条件 | 提前规划居住方案 |\n\n---\n\n## 十、重要风险声明\n\n### 10.1 投资风险\n\n**AIP Growth类别要求投资于管理基金/直接投资等较高风险类型。投资不是存款，本金可能面临损失、流动性风险、汇率风险和管理人风险。客户应将其视为"用资金锁定期换取新西兰居民身份"，而非确保本金的储蓄替代品。**\n\n### 10.2 政策风险\n\n**新西兰移民政策历史上多次调整：2022年将投资额从NZD 100万/NZD 300万调整至NZD 500万/NZD 1,500万；2025年4月又大幅降至NZD 500万/NZD 1,000万并取消英语。虽然当前政策对投资者友好，但未来仍可能提高门槛或调整条件。正式申请前必须由新西兰持牌移民顾问确认最新政策。**\n\n### 10.3 PRV居住风险\n\n**取得居民签证后，转PRV通常需满足2年居住或投资等条件。如果客户完全不在新西兰居住且不满足其他替代条件，可能无法成功申请PRV。**\n\n### 10.4 税务风险\n\n**取得居民签证不等于自动成为新西兰税务居民。但如果客户在新西兰长期居住（≥183天），将触发新西兰全球收入申报义务。不在新西兰居住的投资者通常不受新西兰全球征税影响。**\n\n### 10.5 国籍风险\n\n**入籍新西兰后根据《中国国籍法》第9条自动丧失中国国籍。但持有PRV不触发此条款——客户可选择永久持有PRV而不入籍，这在所有英语发达国家中独一无二。**\n\n### 10.6 资金出境风险\n\n**NZD 500万-1,000万（约RMB 2,250万-4,500万）属于大额资金出境，任何地下钱庄、虚假贸易、现金搬运都是P0红区。本方案必须以可解释、可追踪、可留痕的资金路径为前提。**\n\n---\n\n## 附件：引用法律法规与项目资料来源\n\n### A. 本次方案引用到的法律依据清单\n\n| 法案/规则 | 条款 | 本次用途 | 更新 |\n|---|---|---|---|\n| Immigration Act 2009 (NZ) | — | 新西兰移民法上位法 | 现行有效 |\n| Immigration (Visa, Entry Permission, and Related Matters) Regulations 2010 | — | 各类签证具体要求和申请流程 | 持续修订 |\n| Active Investor Plus Visa 2025年4月1日改革 | 2025年4月1日起实施 | 降低投资门槛至NZD 500万/1,000万，取消英语要求，扩大投资范围 | 2025-04-01 |\n| Skilled Migrant Category Resident Visa (6分制) | 2023年10月起 | 取代原180分制，6分制评分体系 | 2023-10-01 |\n| Green List 移民路径 | Tier 1 (Straight to Residence) / Tier 2 (Work to Residence) | 紧缺职业快速居留 | 持续更新 |\n| AEWV Accredited Employer Work Visa | 2022年7月起 | 雇主认证工签框架 | 持续修订 |\n| 《中华人民共和国国籍法》 | 第3条、第9条 | 双重国籍禁止 | 现行有效 |\n| 中新建交协定/双边税务协定 | — | 中新双边关系基础文件 | 现行有效 |\n\n### B. 多个法案/政策之间的相互影响\n\n| 组合 | 相互影响 | 需注意 |\n|---|---|---|\n| AIP 2025改革 + 取消英语 | 投资门槛降低且语言要求移除，大幅扩大潜在申请人池 | 可能导致申请激增和未来政策收紧。 |\n| Resident Visa → PRV | RV满2年后可申请PRV，需满足居住/投资/税务居民等条件 | 不能简单假设"拿到RV后躺着就能转PRV"。 |\n| PRV + 不入籍 | PRV无任何居住和出入境限制，可永久持有不停用 | 提供"永久身份但保留中国国籍"的独特可能。 |\n| 新西兰国籍 + 澳大利亚 | 新西兰公民可自由在澳生活工作（SCV 444），4年澳洲居住可申请澳籍 | 变相提供"澳洲+新西兰"双通道。 |\n| 中新DTA + 非居民税务身份 | 不在新西兰居住的投资者通常不触发新西兰全球征税 | 持有RV但居住在中国≠自动新西兰税务居民。 |\n\n### C. 交付前客户需补充与确认资料\n\n1. 客户完整家庭信息与随行成员名单（含所有24岁以下受养子女）。\n2. 主申请人及随行成员护照、身份证、户口本、婚姻/出生证明。\n3. 资金来源证明：纳税记录、企业审计报告、资产变现文件、银行流水。\n4. 新西兰持牌移民顾问出具的最新AIP投资合规确认和费用明细。\n5. 客户明确投资风险偏好（Growth vs Balanced）。\n6. 如走SMC 6分制/Green List：学历认证(ECA/IQA)、英语考试、职业评估。\n7. 所有国家无犯罪记录。\n";`;
