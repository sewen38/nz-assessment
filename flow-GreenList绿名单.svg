xt><line x1="600" y1="102" x2="600" y2="135" stroke="#c8102e" stroke-width="1.5"/><line x1="600" y1="135" x2="46" y2="135" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="110" width="200" height="50" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/><text x="150" y="130" text-anchor="middle" font-size="10" font-weight="600">Tier1:直通居留</text><text x="150" y="148" text-anchor="middle" font-size="9" fill="#6b7280">无需2年等待</text><line x1="252" y1="135" x2="288" y2="135" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="110" width="200" height="50" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/><text x="390" y="130" text-anchor="middle" font-size="10" font-weight="600">RV满2年→PRV</text><text x="390" y="148" text-anchor="middle" font-size="9" fill="#6b7280">永久回头签</text><line x1="492" y1="135" x2="528" y2="135" stroke="#c8102e" stroke-width="1.5" marker-end="url(#a)"/><rect x="530" y="110" width="140" height="50" rx="10" fill="#fef2f5" stroke="#c8102e" stroke-width="2"/><text x="600" y="130" text-anchor="middle" font-size="10" font-weight="700">5年→入籍(可选)</text><text x="600" y="148" text-anchor="middle" font-size="9" fill="#6b7280">新西兰护照</text></svg>
